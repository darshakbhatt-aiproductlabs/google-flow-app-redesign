<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Flow — Interactive Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #0e0f12;
    --surface: #17181c;
    --surface-2: #1f2024;
    --surface-3: #2a2c31;
    --border: #2c2e34;
    --text: #ffffff;
    --text-dim: #b8bbc1;
    --text-faint: #777a82;
    --accent: #e3266c;   /* the pink-D avatar color */
    --blue: #8ab4f8;     /* google blue accent on the pricing screens */
    --blue-deep: #1a73e8;
    --green: #4ad27d;
    --amber: #ffb84d;
    --purple: #c58af9;
    --shadow: 0 24px 60px rgba(0,0,0,.55);
    --font-display: 'Google Sans Display', 'Google Sans', system-ui, -apple-system, sans-serif;
    --font-body: 'Google Sans', 'Roboto', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #07080a; color: var(--text); font-family: var(--font-body); }

  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 600px at 12% 8%, rgba(227,38,108,.10), transparent 60%),
      radial-gradient(800px 500px at 88% 92%, rgba(138,180,248,.08), transparent 60%),
      #07080a;
    padding: 36px 24px 80px;
  }

  /* ========== PAGE SHELL ========== */
  .shell {
    max-width: 1480px;
    margin: 0 auto;
  }
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 14px;
  }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: #000;
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px var(--border), 0 8px 24px rgba(0,0,0,.5);
    overflow: hidden;
  }
  .brand-mark svg { width: 28px; height: 28px; }
  .brand-name {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 500; letter-spacing: -.01em;
  }
  .brand-name small {
    font-size: 11px; font-weight: 500; letter-spacing: .04em;
    padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px;
    margin-left: 8px; color: var(--text-dim); text-transform: none;
  }
  .meta {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    text-align: right;
  }
  .meta h1 {
    font-family: var(--font-display);
    font-size: 18px; font-weight: 500; letter-spacing: -.01em;
  }
  .meta p { font-size: 12.5px; color: var(--text-faint); max-width: 460px; line-height: 1.5; }

  .legend {
    display: flex; gap: 18px; flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 30px;
    font-size: 12.5px; color: var(--text-dim);
  }
  .legend strong { color: var(--text); font-weight: 500; }
  .legend-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  .legend-dot.new { background: var(--accent); }
  .legend-dot.kept { background: var(--text-faint); }
  .legend-dot.upsell { background: var(--blue); }

  /* ========== PHONE GRID ========== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 36px 28px;
    align-items: start;
  }

  .frame-wrap { display: flex; flex-direction: column; gap: 10px; }
  .frame-label {
    font-family: var(--font-display);
    font-size: 13.5px; font-weight: 500;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .frame-label .badge {
    font-size: 10px; padding: 2px 8px; border-radius: 999px;
    background: rgba(227,38,108,.15); color: var(--accent);
    font-weight: 500; letter-spacing: .02em;
  }
  .frame-label .badge.kept { background: rgba(120,124,134,.18); color: var(--text-dim); }
  .frame-label .badge.disclosure { background: rgba(138,180,248,.15); color: var(--blue); }
  .frame-caption { font-size: 12px; color: var(--text-faint); line-height: 1.5; }

  /* ========== PHONE ========== */
  .phone {
    width: 340px;
    height: 736px;
    margin: 0 auto;
    background: #000;
    border-radius: 42px;
    padding: 8px;
    box-shadow:
      0 0 0 2px #1c1d22,
      0 0 0 3px #2c2d33,
      0 50px 100px -20px rgba(0,0,0,.7),
      0 30px 60px -30px rgba(0,0,0,.5);
    position: relative;
  }
  .phone-screen {
    background: #000;
    width: 100%; height: 100%;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  /* status bar */
  .status {
    height: 28px; padding: 0 18px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-display);
    font-size: 12px; font-weight: 500;
    color: #fff;
  }
  .status .icons { display: flex; gap: 4px; align-items: center; }
  .status .icons span {
    display: inline-block; width: 13px; height: 13px;
    background: currentColor;
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    opacity: .9;
  }
  .battery {
    border: 1.2px solid currentColor;
    border-radius: 3px;
    width: 22px; height: 11px;
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 8.5px; font-weight: 500;
    padding: 0 2px;
  }
  .battery::after {
    content: ''; position: absolute; right: -3px;
    width: 2px; height: 5px; background: currentColor; border-radius: 0 2px 2px 0;
  }

  .nav-bar {
    height: 34px;
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid #14151a;
    background: #000;
  }
  .nav-bar i {
    display: inline-block;
    width: 16px; height: 16px;
    border-radius: 2px;
    border: 1.5px solid rgba(255,255,255,.55);
  }
  .nav-bar i.circ { border-radius: 50%; }
  .nav-bar i.back { width: 12px; height: 12px; border: 0; transform: rotate(-45deg); border-left: 1.5px solid rgba(255,255,255,.55); border-bottom: 1.5px solid rgba(255,255,255,.55); }

  .screen-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 0 0;
    background: #000;
    scrollbar-width: thin;
    scrollbar-color: #2a2c31 transparent;
  }
  .screen-body::-webkit-scrollbar { width: 4px; }
  .screen-body::-webkit-scrollbar-thumb { background: #2a2c31; border-radius: 4px; }

  /* ========== APP HEADER ========== */
  .app-header {
    padding: 14px 18px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .app-title {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 500; letter-spacing: -.015em;
  }
  .beta-pill {
    border: 1px solid #555a64;
    color: #cbcdd2;
    font-size: 10px; font-weight: 500; letter-spacing: .06em;
    padding: 3px 9px; border-radius: 999px;
    margin-left: 8px;
  }
  .right-tools { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    color: #d6d8de;
    position: relative;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent);
    color: white;
    display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 500;
    font-size: 16px;
    box-shadow: 0 0 0 2px #000, 0 0 0 3px rgba(227,38,108,.25);
  }

  /* ========== MODE CARDS — 2-row grid so all 8 modes are visible ========== */
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px 8px;
    padding: 6px 14px 14px;
  }
  .mode-pair { display: flex; flex-direction: column; }
  .mode-card {
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 12px;
    background-size: cover; background-position: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .mode-card.new::after {
    content: 'NEW';
    position: absolute; top: 5px; right: 5px;
    background: var(--accent); color: #fff;
    font-family: var(--font-display);
    font-size: 7.5px; font-weight: 700; letter-spacing: .04em;
    padding: 2px 5px; border-radius: 4px;
    box-shadow: 0 2px 6px rgba(227,38,108,.4);
  }
  .mode-pair > span {
    margin-top: 6px;
    font-family: var(--font-display);
    font-size: 10.5px; font-weight: 400;
    color: #e6e8ee; line-height: 1.22;
    text-align: center;
  }

  /* gradient backgrounds for mode cards */
  .bg-gen-image { background: linear-gradient(135deg,#f5d8b6 0%,#e7a36f 45%,#a85a2a 100%); }
  .bg-gen-video { background: linear-gradient(135deg,#5da8ff 0%,#7c4dff 50%,#1c1442 100%); }
  .bg-animate   { background: linear-gradient(135deg,#7ec06e 0%,#3a6e3a 60%,#1b3015 100%); }
  .bg-edit-photo{ background: linear-gradient(135deg,#fbb6c4 0%,#e35f8a 60%,#4a1a32 100%); }
  .bg-edit-video{ background: linear-gradient(135deg,#a9c2ff 0%,#5b6cf0 60%,#1a1b3a 100%); }
  .bg-storyboard{ background: linear-gradient(135deg,#ffd86b 0%,#f08a26 50%,#3a1b06 100%); }
  .bg-lipsync   { background: linear-gradient(135deg,#c58af9 0%,#6e3fc9 60%,#1f0f3a 100%); }
  .bg-charlib   { background: linear-gradient(135deg,#7be0d0 0%,#2f9d8f 60%,#0a3a37 100%); }
  /* Notebook mode card — uses a paper-texture gradient with the Gemini star and Flow play-triangle co-existing */
  .bg-notebook  { background:
      linear-gradient(135deg, rgba(255,255,255,.06), rgba(0,0,0,.3)),
      linear-gradient(160deg,#f6c66a 0%,#e35f8a 35%,#5da8ff 75%,#0a1430 100%);
      position:relative; overflow:hidden; }
  .bg-notebook::after {
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(180deg, transparent 60%, rgba(255,255,255,.15) 60.5%, transparent 61.5%),
      linear-gradient(180deg, transparent 75%, rgba(255,255,255,.15) 75.5%, transparent 76.5%),
      linear-gradient(180deg, transparent 88%, rgba(255,255,255,.15) 88.5%, transparent 89.5%);
    pointer-events:none;
  }

  /* ========== PROJECTS LIST ========== */
  .section-title {
    padding: 4px 18px 8px;
    font-family: var(--font-display);
    font-size: 22px; font-weight: 500; letter-spacing: -.01em;
  }
  .section-row {
    padding: 4px 18px 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pill-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--font-display);
    font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .pill-btn:hover { background: #25272d; }
  .pill-btn svg { width: 14px; height: 14px; }

  .project-row {
    padding: 0 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .project-card {
    background: var(--surface);
    border-radius: 16px;
    aspect-ratio: 16/10;
    position: relative;
    overflow: hidden;
    display: flex; align-items: flex-end;
    padding: 12px;
  }
  .project-card.thumb-1 { background: linear-gradient(135deg,#b56b3c,#3a1a08); }
  .project-card.thumb-2 { background: #1a1b21; }
  .project-card .ts {
    font-family: var(--font-display);
    font-size: 13px; color: #fff;
  }
  .project-card .more {
    position: absolute; top: 12px; right: 12px;
    color: #fff; opacity: .85;
  }

  /* ========== ACCOUNT SCREEN ========== */
  .acc-header {
    padding: 14px 18px 6px;
    display: flex; align-items: center; gap: 14px;
  }
  .acc-header .back-arrow {
    color: #d6d8de;
  }
  .acc-header h2 {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 500; letter-spacing: -.01em;
  }
  .acc-card {
    margin: 14px 16px 12px;
    background: var(--surface);
    border-radius: 18px;
    padding: 14px 14px 16px;
  }
  .acc-user {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .acc-user .avatar { width: 40px; height: 40px; font-size: 17px; box-shadow:none; }
  .acc-user .who { font-family: var(--font-display); font-size: 14px; font-weight: 500; }
  .acc-user .who small { display: block; color: var(--text-faint); font-size: 11.5px; font-weight: 400; margin-top: 1px; }

  .credits-block {
    background: var(--surface-2);
    border-radius: 14px;
    padding: 13px 14px;
  }
  .credits-line {
    display: flex; align-items: center; gap: 8px; font-family: var(--font-display);
    font-size: 14.5px; font-weight: 500;
  }
  .credits-line svg { width: 18px; height: 18px; color: var(--text-dim); }
  .credits-sub { color: var(--text-faint); font-size: 11.5px; margin-top: 2px; }

  .acc-btn {
    display: block; width: 100%;
    padding: 11px;
    border: 0; border-radius: 999px;
    font-family: var(--font-display);
    font-size: 13.5px; font-weight: 500;
    cursor: pointer;
    margin-top: 10px;
  }
  .acc-btn.primary { background: #fff; color: #1a1b21; }
  .acc-btn.outline { background: transparent; color: #fff; border: 1px solid #6d717b; }

  .menu-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    margin: 0 16px 8px;
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 14px;
  }
  .menu-row svg { width: 18px; height: 18px; color: #d6d8de; }
  .menu-row .arrow { margin-left: auto; color: var(--text-faint); }

  /* ========== PRICING SCREEN ========== */
  .pricing-hero {
    padding: 14px 22px 6px;
  }
  .pricing-hero h2 {
    font-family: var(--font-display);
    font-size: 30px; font-weight: 500; letter-spacing: -.02em;
    line-height: 1.05;
  }
  .pricing-hero h2 .accent { color: var(--blue); }
  .pricing-hero p {
    font-size: 12.5px; color: var(--text-faint); margin-top: 10px; line-height: 1.5;
  }

  .billing-toggle {
    display: flex;
    background: var(--surface-2);
    border-radius: 999px;
    margin: 14px 22px 8px;
    padding: 3px;
    font-family: var(--font-display);
  }
  .billing-toggle button {
    flex: 1; background: none; border: 0;
    color: var(--text-faint);
    font-size: 12.5px; font-weight: 500;
    padding: 9px 0; border-radius: 999px;
    cursor: pointer;
  }
  .billing-toggle button.on {
    background: #cad6ff; color: #182a52;
  }
  .save-line {
    color: var(--green); font-size: 11.5px; text-align: center;
    margin-bottom: 10px; font-family: var(--font-display); font-weight: 500;
  }

  .plan-card {
    margin: 0 16px 12px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    position: relative;
  }
  .plan-card.featured { border: 1.5px solid var(--blue); }
  .plan-card .rec {
    position: absolute; top: -10px; left: 16px;
    background: var(--blue); color: #0a1530;
    font-family: var(--font-display);
    font-size: 9px; font-weight: 700;
    letter-spacing: .12em;
    padding: 4px 9px; border-radius: 999px;
  }
  .plan-name {
    font-family: var(--font-display);
    font-size: 18px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .plan-name b { color: var(--blue); font-weight: 500; }
  .plan-tag { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; line-height: 1.4; }
  .plan-price {
    font-family: var(--font-display);
    font-size: 26px; font-weight: 500;
    margin-top: 12px; letter-spacing: -.01em;
  }
  .plan-price small { font-size: 13px; color: var(--text-faint); font-weight: 400; }

  .plan-features { margin-top: 12px; }
  .plan-features li {
    list-style: none;
    display: flex; gap: 8px; align-items: flex-start;
    padding: 5px 0;
    font-size: 12.5px; color: #d8dbe1; line-height: 1.5;
  }
  .plan-features li svg { width: 14px; height: 14px; color: var(--green); flex-shrink: 0; margin-top: 3px; }
  .plan-cta {
    width: 100%; margin-top: 12px;
    background: #cad6ff; color: #182a52;
    border: 0; padding: 11px; border-radius: 999px;
    font-family: var(--font-display); font-weight: 500; font-size: 13.5px;
    cursor: pointer;
  }
  .plan-cta.outline { background: transparent; color: #fff; border: 1px solid #4d5158; }

  /* progressive disclosure addons */
  .addons {
    margin: 8px 16px 12px;
    background: var(--surface);
    border-radius: 18px;
    padding: 4px 14px;
  }
  .addons h3 {
    font-family: var(--font-display);
    font-size: 13.5px; font-weight: 500;
    padding: 12px 0 6px; color: #fff;
  }
  .addons p.note {
    font-size: 11.5px; color: var(--text-faint); margin-bottom: 8px;
  }
  .addon-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0;
    border-top: 1px solid #23252b;
  }
  .addon-row:first-of-type { border-top: 0; }
  .addon-icon {
    width: 32px; height: 32px; border-radius: 9px;
    display: grid; place-items: center;
    background: var(--surface-2);
  }
  .addon-icon svg { width: 16px; height: 16px; color: var(--blue); }
  .addon-info { flex: 1; }
  .addon-info .name { font-family: var(--font-display); font-size: 13.5px; font-weight: 500; }
  .addon-info .desc { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; line-height: 1.4; }
  .addon-row .toggle {
    width: 38px; height: 22px; border-radius: 999px;
    background: #2a2c31; position: relative; cursor: pointer; flex-shrink: 0;
  }
  .addon-row .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: #888c95;
    transition: all .2s;
  }
  .addon-row .toggle.on { background: var(--blue); }
  .addon-row .toggle.on::after { left: 18px; background: #fff; }

  /* ========== CREATE PROJECT ========== */
  .proj-header {
    padding: 12px 16px 6px;
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
  }
  .proj-header .left { display:flex; align-items:center; gap: 12px; }
  .proj-header h3 {
    font-family: var(--font-display); font-size: 17px; font-weight: 500;
  }
  .canvas-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12.5px;
    line-height: 1.55;
  }
  .canvas-empty .upload {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px;
    padding: 9px 14px;
    background: var(--surface-2);
    border-radius: 999px;
    color: var(--text);
    font-family: var(--font-display); font-size: 13px;
    cursor: pointer;
  }
  .canvas-empty .upload svg { width: 14px; height: 14px; }

  /* asset preview thumbnails when generated */
  .canvas-asset {
    margin: 18px;
    border-radius: 18px;
    aspect-ratio: 9/16;
    background-size: cover; background-position: center;
    position: relative;
    overflow: hidden;
  }
  .canvas-asset.demo1 { background: linear-gradient(160deg,#ffce7e,#a85a2a 60%,#3a1a08); }
  .canvas-asset .play {
    position: absolute; inset: 0; display: grid; place-items: center;
  }
  .canvas-asset .play span {
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,.92);
    display: grid; place-items: center;
    color: #0a0a0a; padding-left: 4px;
  }
  .canvas-asset .play span::after {
    content: ''; border-style: solid; border-width: 8px 0 8px 13px;
    border-color: transparent transparent transparent #0a0a0a;
  }
  .canvas-asset .duration {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 11px;
    padding: 3px 8px; border-radius: 4px;
    font-family: var(--font-display);
  }
  .post-actions {
    display: flex; gap: 8px; padding: 0 16px 8px;
    flex-wrap: wrap;
  }
  .post-actions .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 999px;
    padding: 7px 11px;
    font-family: var(--font-display);
    font-size: 11.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 5px;
    cursor: pointer;
  }
  .post-actions .chip svg { width: 12px; height: 12px; }
  .post-actions .chip.accent { background: rgba(227,38,108,.13); border-color: rgba(227,38,108,.4); color: #ff5e9a; }

  /* prompt bar */
  .prompt-bar {
    margin: 8px 12px 8px;
    background: var(--surface);
    border-radius: 18px;
    padding: 14px 14px 12px;
  }
  .prompt-bar .input {
    color: var(--text-faint);
    font-size: 14px;
    min-height: 24px;
  }
  .prompt-bar .input.filled { color: var(--text); }
  .prompt-bar .controls {
    display: flex; align-items: center; gap: 8px; margin-top: 12px;
    justify-content: space-between;
  }
  .prompt-bar .plus {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    color: #d6d8de;
  }
  .prompt-bar .plus svg { width: 16px; height: 16px; }
  .prompt-bar .asset-chip {
    background: rgba(255,255,255,.07);
    color: #cbcdd2;
    padding: 7px 12px;
    border-radius: 999px;
    font-family: var(--font-display);
    font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .prompt-bar .asset-chip svg { width: 13px; height: 13px; }
  .prompt-bar .go {
    width: 36px; height: 36px; border-radius: 50%; background: #fff;
    display: grid; place-items: center;
    color: #000;
  }
  .prompt-bar .go svg { width: 16px; height: 16px; }

  /* tool tray (new full-app controls) */
  .tool-tray {
    margin: 6px 12px 0;
    background: var(--surface);
    border-radius: 18px;
    padding: 10px 8px 12px;
  }
  .tray-credit-line {
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 12px;
    padding: 4px 0 10px;
  }
  .tray-credit-line u { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.4); text-underline-offset: 2px; }
  .tab-row {
    display: flex; gap: 6px;
    background: rgba(255,255,255,.04);
    padding: 4px;
    border-radius: 12px;
    margin: 0 6px 8px;
  }
  .tab-row button {
    flex: 1;
    border: 0; background: transparent;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 12.5px; font-weight: 500;
    padding: 8px;
    border-radius: 9px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; justify-content: center;
  }
  .tab-row button svg { width: 14px; height: 14px; }
  .tab-row button.on { background: rgba(255,255,255,.13); color: #fff; }

  .opt-row {
    display: flex; gap: 5px;
    margin: 6px 6px 6px;
    background: rgba(255,255,255,.04);
    border-radius: 12px;
    padding: 5px;
  }
  .opt-row .opt {
    flex: 1; text-align: center;
    padding: 8px 4px;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 11.5px; font-weight: 500;
    border-radius: 9px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .opt-row .opt.on { background: rgba(255,255,255,.13); color: #fff; }
  .ratio-icon {
    width: 16px; height: 16px;
    border: 1.4px solid currentColor; border-radius: 2px;
    display: inline-block;
  }
  .ratio-1-1 { width: 13px; height: 13px; }
  .ratio-4-3 { width: 16px; height: 12px; }
  .ratio-16-9 { width: 18px; height: 10px; }
  .ratio-3-4 { width: 12px; height: 16px; }
  .ratio-9-16 { width: 10px; height: 18px; }

  .model-picker {
    margin: 8px 6px 4px;
    background: rgba(255,255,255,.06);
    border-radius: 12px;
    padding: 11px 14px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-display);
    font-size: 13px;
    cursor: pointer;
  }
  .model-picker .nm { display: flex; align-items: center; gap: 8px; }
  .model-picker .nm .em { font-size: 16px; }
  .model-picker .caret { color: var(--text-dim); }

  /* NEW: advanced controls row */
  .adv-controls {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 8px 6px 4px;
  }
  .adv-control {
    background: rgba(255,255,255,.05);
    border-radius: 11px;
    padding: 10px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 10.5px; font-weight: 500; text-align: center;
    cursor: pointer;
    position: relative;
  }
  .adv-control svg { width: 16px; height: 16px; }
  .adv-control.active { color: #fff; background: rgba(227,38,108,.16); }
  .adv-control.active svg { color: var(--accent); }
  .adv-control .new-dot {
    position: absolute; top: 5px; right: 5px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }

  /* ========== ASSET PICKER (bottom sheet) ========== */
  .picker-overlay { background: #000; }
  .picker-overlay .app-mute {
    padding: 14px 18px 10px;
    opacity: .35;
    pointer-events: none;
  }
  .picker-overlay .mute-modes {
    display: flex; gap: 12px; padding: 0 18px;
    opacity: .35;
  }
  .picker-overlay .mute-modes div {
    width: 70px; height: 90px; border-radius: 14px;
    background: linear-gradient(135deg,#5a5e68,#21232a);
  }

  .picker-sheet {
    position: absolute; left: 0; right: 0; bottom: 34px;
    background: #1c1d22;
    border-radius: 20px 20px 0 0;
    padding: 10px 16px 16px;
    max-height: 560px;
    overflow-y: auto;
  }
  .picker-sheet::-webkit-scrollbar { display: none; }
  .picker-grip {
    width: 38px; height: 4px;
    background: #4a4d54;
    border-radius: 4px;
    margin: 0 auto 14px;
  }
  .picker-search {
    background: #2a2c32;
    border-radius: 999px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .picker-search svg { width: 16px; height: 16px; }

  .picker-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .picker-tab {
    background: #2a2c32;
    color: var(--text-dim);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--font-display);
    font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .picker-tab svg { width: 12px; height: 12px; }
  .picker-tab.on { background: var(--blue-deep); color: #fff; }
  .picker-tab.new {
    background: rgba(227,38,108,.15);
    color: #ff7eb0;
    border: 1px solid rgba(227,38,108,.4);
  }

  .picker-perm {
    background: #2a2c32;
    border-radius: 12px;
    padding: 11px 12px;
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 12px;
  }
  .picker-perm svg { width: 16px; height: 16px; color: var(--blue); margin-top: 2px; }
  .picker-perm .body { flex: 1; font-size: 12px; color: var(--text-dim); line-height: 1.4; }
  .picker-perm .body strong { color: #fff; font-weight: 500; }
  .picker-perm .dismiss { color: var(--blue); font-family: var(--font-display); font-size: 12px; font-weight: 500; }

  .grid3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .grid3 .tile {
    aspect-ratio: 9/16;
    border-radius: 8px;
    background-size: cover; background-position: center;
    position: relative;
  }
  .grid3 .tile .badge {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,.7); color: #fff;
    font-size: 9.5px; padding: 2px 5px; border-radius: 4px;
    font-family: var(--font-display);
  }
  .grid3 .tile .play {
    position: absolute; top: 6px; left: 6px;
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,.85);
    display: grid; place-items: center;
  }
  .grid3 .tile .play::after {
    content: ''; border: 3px solid transparent; border-left: 5px solid #000;
    margin-left: 2px;
  }
  .pg-bg-1 { background: linear-gradient(135deg,#3a4d8a,#0f1c3a); }
  .pg-bg-2 { background: linear-gradient(135deg,#6a3aa8,#240a44); }
  .pg-bg-3 { background: linear-gradient(135deg,#c95a3a,#3a1408); }
  .pg-bg-4 { background: linear-gradient(135deg,#d4af6a,#3a2a0a); }
  .pg-bg-5 { background: linear-gradient(135deg,#9a5ad8,#3a1a5a); }
  .pg-bg-6 { background: linear-gradient(135deg,#d4a73a,#5a3a0a); }

  /* character tiles for new picker tab */
  .grid2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .char-tile {
    aspect-ratio: 4/5;
    border-radius: 14px;
    background-size: cover; background-position: center;
    position: relative;
    overflow: hidden;
  }
  .char-tile .name {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.7));
    padding: 18px 10px 8px;
    font-family: var(--font-display);
    font-size: 12px; color: #fff;
  }
  .char-tile .new-badge {
    position: absolute; top: 6px; right: 6px;
    background: var(--accent); color: #fff;
    font-family: var(--font-display);
    font-size: 8.5px; font-weight: 700; letter-spacing: .04em;
    padding: 2px 6px; border-radius: 4px;
  }
  .char-tile.empty {
    background: transparent;
    border: 1.5px dashed #4a4d54;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 12px;
  }
  .ch-1 { background: linear-gradient(160deg,#f8d4a3,#a06840,#3a1f10); }
  .ch-2 { background: linear-gradient(160deg,#c5e4ff,#5a78bf,#1c2c5a); }
  .ch-3 { background: linear-gradient(160deg,#ffb6c5,#c34a78,#3a0f24); }
  .ch-4 { background: linear-gradient(160deg,#9ad8b3,#3a8758,#0d2f1c); }

  /* ========== STORAGE CAP UPSELL (progressive disclosure) ========== */
  .storage-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.55);
    display: flex; align-items: flex-end;
  }
  .storage-sheet {
    width: 100%;
    background: #17181c;
    border-radius: 22px 22px 0 0;
    padding: 22px 18px 22px;
    position: relative;
  }
  .storage-sheet .grip {
    width: 38px; height: 4px;
    background: #4a4d54;
    border-radius: 4px;
    margin: -8px auto 14px;
  }
  .ss-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(138,180,248,.2), rgba(138,180,248,.05));
    color: var(--blue);
    display: grid; place-items: center;
    margin-bottom: 12px;
  }
  .ss-icon svg { width: 26px; height: 26px; }
  .storage-sheet h3 {
    font-family: var(--font-display);
    font-size: 18px; font-weight: 500;
    margin-bottom: 6px;
  }
  .storage-sheet p {
    font-size: 12.5px; color: var(--text-dim); line-height: 1.5;
    margin-bottom: 14px;
  }
  .storage-meter {
    background: #23252b;
    border-radius: 999px;
    height: 6px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .storage-meter > div {
    height: 100%;
    background: linear-gradient(90deg, #f6c66a 0%, #f08a26 50%, #e3266c 100%);
    width: 96%;
    border-radius: 999px;
  }
  .meter-label {
    display: flex; justify-content: space-between;
    font-family: var(--font-display); font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .ss-option {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px;
    background: #23252b;
    border-radius: 14px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .ss-option.featured { border: 1.5px solid var(--blue); background: rgba(138,180,248,.06); }
  .ss-option .desc {
    font-family: var(--font-display); font-size: 13.5px; font-weight: 500;
  }
  .ss-option .desc small {
    display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 1px; font-weight: 400;
  }
  .ss-option .price {
    font-family: var(--font-display); font-size: 13.5px; font-weight: 500;
  }
  .ss-option .price small {
    color: var(--text-faint); font-weight: 400;
  }
  .ss-cta {
    width: 100%; padding: 13px;
    background: #cad6ff; color: #182a52;
    border: 0; border-radius: 999px;
    font-family: var(--font-display); font-weight: 500; font-size: 14px;
    margin-top: 10px;
    cursor: pointer;
  }
  .ss-skip {
    width: 100%; text-align: center;
    background: none; border: 0;
    color: var(--text-dim);
    font-family: var(--font-display); font-size: 13px;
    padding: 12px;
    margin-top: 2px;
    cursor: pointer;
  }

  /* ========== RESULT EDIT SCREEN ========== */
  .result-frame {
    margin: 14px;
    border-radius: 18px;
    aspect-ratio: 9/16;
    background-size: cover; background-position: center;
    position: relative;
    overflow: hidden;
  }
  .result-frame.demo2 { background: linear-gradient(160deg,#7fa8ff,#3a4ba8,#0a163a); }
  .result-frame .audio-bar {
    position: absolute; bottom: 12px; left: 12px; right: 12px;
    height: 28px;
    background: rgba(0,0,0,.5);
    border-radius: 6px;
    padding: 0 10px;
    display: flex; align-items: center; gap: 8px;
    color: #fff;
    font-family: var(--font-display);
    font-size: 11px;
  }
  .audio-wave {
    flex: 1; height: 14px;
    background-image: repeating-linear-gradient(90deg, #fff, #fff 1.5px, transparent 1.5px, transparent 4px);
    -webkit-mask-image: linear-gradient(180deg,#fff,#fff);
    mask-image: linear-gradient(180deg,#fff,#fff);
    opacity: .7;
  }
  .edit-toolbar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 6px; padding: 0 14px 12px;
  }
  .edit-toolbar .tool {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 10.5px; font-weight: 500;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    position: relative;
  }
  .edit-toolbar .tool svg { width: 16px; height: 16px; }
  .edit-toolbar .tool.new::after {
    content: 'NEW';
    position: absolute; top: 4px; right: 4px;
    background: var(--accent); color: #fff;
    font-size: 7.5px; font-weight: 700;
    padding: 1px 4px; border-radius: 3px;
  }

  /* ========== MUSIC UPSELL ========== */
  .music-card {
    margin: 12px 14px;
    background: linear-gradient(140deg, rgba(197,138,249,.18), rgba(138,180,248,.06));
    border: 1px solid rgba(197,138,249,.35);
    border-radius: 18px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .music-card::before {
    content: ''; position: absolute; top: -30px; right: -30px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(197,138,249,.5), transparent 70%);
    pointer-events: none;
  }
  .music-card h4 {
    font-family: var(--font-display);
    font-size: 15px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .music-card h4 svg { width: 16px; height: 16px; color: var(--purple); }
  .music-card .tag {
    display: inline-block; margin-left: auto;
    background: rgba(197,138,249,.2); color: var(--purple);
    font-size: 9.5px; font-weight: 600; letter-spacing: .06em;
    padding: 2px 6px; border-radius: 4px;
  }
  .music-card p {
    font-size: 12px; color: var(--text-dim);
    margin: 6px 0 12px; line-height: 1.5;
  }
  .music-card .price-line {
    font-family: var(--font-display); font-size: 12.5px;
    color: #fff;
  }
  .music-card .price-line b { color: var(--purple); }
  .music-card-actions {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .music-card-actions button {
    flex: 1; padding: 9px; border-radius: 999px;
    border: 0;
    font-family: var(--font-display); font-size: 12px; font-weight: 500;
    cursor: pointer;
  }
  .music-card-actions .add { background: var(--purple); color: #1c0c3a; }
  .music-card-actions .skip { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

  /* ========== COMPARISON ROW (right panel context) ========== */
  .ctx-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    margin-top: 24px;
  }
  .ctx-panel h3 {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 500;
    margin-bottom: 14px;
    letter-spacing: -.005em;
  }

  /* responsive */
  @media (max-width: 720px) {
    body { padding: 18px 12px 60px; }
    .grid { grid-template-columns: 1fr; }
    .phone { width: 320px; height: 700px; }
  }

  /* ============== PRD/MOCK CHAPTER LAYOUT ============== */
  .cover {
    padding: 36px 36px 28px;
    background:
      radial-gradient(ellipse at top left, rgba(246,198,106,.12), transparent 50%),
      radial-gradient(ellipse at top right, rgba(93,168,255,.10), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(227,38,108,.08), transparent 60%);
    border-radius: 28px;
    margin-bottom: 28px;
  }
  .cover-head {
    display:flex; align-items:flex-start; justify-content:space-between; gap: 40px;
    flex-wrap:wrap; margin-bottom: 22px;
  }
  .cover-logo {
    display:flex; align-items:center; gap: 14px;
  }
  .cover-logo .lg-icon {
    width: 52px; height: 52px; border-radius: 16px;
    background: linear-gradient(135deg,#1a1c22,#0d0e12);
    display:grid; place-items:center;
    box-shadow: 0 8px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .cover h1 {
    font-family: var(--font-display);
    font-size: 30px; font-weight: 500; line-height: 1.05;
    letter-spacing: -.025em; margin: 0;
  }
  .cover h1 small {
    display:block; font-size:13px; color: var(--text-faint); font-weight: 400;
    letter-spacing: 0; margin-top: 6px;
  }
  .cover .meta-block {
    text-align: right; font-family: var(--font-display); font-size: 12px;
    color: var(--text-dim); line-height: 1.7;
  }
  .cover .meta-block strong { color: #fff; font-weight: 500; }
  .cover-deck {
    font-family: var(--font-body); font-size: 14.5px; line-height: 1.65;
    color: #d8dbe1; max-width: 920px; margin-bottom: 20px;
  }
  .cover-deck strong { color: #fff; font-weight: 500; }
  .toc {
    display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px; margin-top: 22px;
  }
  .toc-item {
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 14px;
    font-family: var(--font-display); font-size: 12px;
    color: var(--text-dim); display:flex; gap:10px; align-items:baseline;
    transition: background .15s ease;
  }
  .toc-item:hover { background: rgba(255,255,255,.07); cursor: pointer; }
  .toc-item .num {
    font-size: 11px; color: var(--blue); font-weight: 500;
    min-width: 18px;
  }
  .toc-item strong { color: #fff; font-weight: 500; }

  /* Chapter band */
  .chapter {
    margin: 64px 0 28px;
    scroll-margin-top: 20px;
  }
  .chapter-head {
    border-top: 1px solid var(--border);
    padding-top: 32px; margin-bottom: 20px;
    display:flex; align-items:flex-start; justify-content:space-between; gap: 40px;
    flex-wrap: wrap;
  }
  .chapter-num {
    font-family: var(--font-display); font-size: 11px;
    color: var(--blue); letter-spacing: .12em;
    text-transform: uppercase; font-weight: 500; margin-bottom: 8px;
  }
  .chapter h2 {
    font-family: var(--font-display);
    font-size: 26px; font-weight: 500; line-height: 1.1;
    letter-spacing: -.02em; margin: 0;
    max-width: 600px;
  }
  .chapter-thesis {
    font-family: var(--font-body); font-size: 14px; line-height: 1.7;
    color: #d8dbe1; max-width: 480px; margin-top: 4px;
  }
  .chapter-thesis strong { color: #fff; font-weight: 500; }

  /* Chapter content blocks */
  .ch-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 28px;
    margin-bottom: 28px;
    align-items: start;
  }
  .ch-row.single { grid-template-columns: 1fr; max-width: 920px; }
  .ch-row.duo    { grid-template-columns: 1fr 1fr; }
  .ch-row.with-note { grid-template-columns: minmax(260px, 360px) 1fr; gap: 32px; }

  /* Side-note panel (doc excerpt) */
  .doc-note {
    background: rgba(255,255,255,.025);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: 14px;
    padding: 18px 20px;
    font-family: var(--font-body); font-size: 13.5px;
    line-height: 1.65; color: #d8dbe1;
    align-self: start;
  }
  .doc-note h4 {
    font-family: var(--font-display); font-size: 11px;
    color: var(--blue); letter-spacing: .08em; text-transform: uppercase;
    font-weight: 500; margin: 0 0 10px;
  }
  .doc-note h5 {
    font-family: var(--font-display); font-size: 14px;
    font-weight: 500; color: #fff; margin: 14px 0 6px;
    letter-spacing: -.005em;
  }
  .doc-note p { margin: 0 0 10px; }
  .doc-note p:last-child { margin-bottom: 0; }
  .doc-note ul {
    list-style: none; padding: 0; margin: 0 0 8px;
  }
  .doc-note li {
    padding: 3px 0; position: relative; padding-left: 14px;
  }
  .doc-note li::before {
    content: "·"; position: absolute; left: 4px; color: var(--blue); font-weight: 700;
  }
  .doc-note strong { color: #fff; font-weight: 500; }
  .doc-note table {
    width:100%; border-collapse: collapse; font-size: 12px;
    font-family: var(--font-display); margin: 8px 0;
  }
  .doc-note th, .doc-note td {
    padding: 6px 8px; text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .doc-note th {
    font-weight: 500; color: var(--text-faint);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
  }
  .doc-note .verdict-keep   { color: var(--green); font-weight: 500; }
  .doc-note .verdict-optin  { color: #f6c66a; }
  .doc-note .verdict-out    { color: var(--text-faint); }

  .doc-note.gold {
    border-left-color: #f6c66a;
    background: linear-gradient(140deg, rgba(246,198,106,.05), rgba(255,255,255,.02));
  }
  .doc-note.gold h4 { color: #f6c66a; }
  .doc-note.gold li::before { color: #f6c66a; }

  .doc-note.green {
    border-left-color: var(--green);
    background: linear-gradient(140deg, rgba(74,210,125,.05), rgba(255,255,255,.02));
  }
  .doc-note.green h4 { color: var(--green); }
  .doc-note.green li::before { color: var(--green); }

  .doc-note.accent {
    border-left-color: var(--accent);
    background: linear-gradient(140deg, rgba(227,38,108,.06), rgba(255,255,255,.02));
  }
  .doc-note.accent h4 { color: var(--accent); }
  .doc-note.accent li::before { color: var(--accent); }

  /* full-width data table inside a chapter */
  .data-block {
    background: var(--surface-2);
    border-radius: 18px;
    padding: 22px;
    margin: 14px 0 28px;
  }
  .data-block h4 {
    font-family: var(--font-display); font-size: 12px;
    color: var(--text-faint); letter-spacing: .06em; text-transform: uppercase;
    font-weight: 500; margin: 0 0 14px;
  }
  .data-block table {
    width: 100%; border-collapse: collapse;
    font-family: var(--font-body); font-size: 13px; color: #d8dbe1;
  }
  .data-block th, .data-block td {
    padding: 10px 12px; text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .data-block th {
    font-family: var(--font-display); font-weight: 500;
    color: var(--text-faint); font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .04em;
    background: rgba(255,255,255,.02);
  }
  .data-block tr:last-child td { border-bottom: 0; }
  .data-block .pos { color: var(--green); }
  .data-block .neg { color: #ff8888; }
  .data-block .neutral { color: #ffb84d; }
  .data-block strong { color: #fff; font-weight: 500; }

  /* Special: phone with adjacent note */
  .phone-with-note {
    display: grid;
    grid-template-columns: minmax(290px, 340px) 1fr;
    gap: 32px;
    margin-bottom: 36px;
    align-items: start;
  }
  .phone-with-note.reverse {
    grid-template-columns: 1fr minmax(290px, 340px);
  }
  .phone-with-note.reverse .phone-col { order: 2; }
  .phone-col { display:flex; flex-direction:column; align-items:center; }

  /* Override default frame-wrap when inside chapter (still works in legacy grid) */
  .chapter .frame-wrap {
    margin-bottom: 0;
  }

  /* Twin phones row (for 18+19) */
  .phone-twin {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    margin-bottom: 28px;
    align-items: start;
  }

  /* TL;DR call-out */
  .tldr {
    background: linear-gradient(135deg, rgba(138,180,248,.08), rgba(246,198,106,.05));
    border: 1px solid rgba(138,180,248,.25);
    border-radius: 18px;
    padding: 22px 26px;
    margin: 0 0 28px;
    font-family: var(--font-body); font-size: 14.5px; line-height: 1.7;
    color: #d8dbe1;
  }
  .tldr h3 {
    font-family: var(--font-display); font-size: 11px;
    color: var(--blue); letter-spacing: .12em; text-transform: uppercase;
    font-weight: 500; margin: 0 0 10px;
  }
  .tldr strong { color: #fff; font-weight: 500; }

  /* The byline / colophon */
  .colophon {
    margin: 80px 0 0;
    padding: 36px 32px;
    background:
      radial-gradient(ellipse at center, rgba(246,198,106,.10), transparent 60%),
      linear-gradient(180deg, var(--surface-2), var(--surface));
    border-radius: 24px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .colophon h3 {
    font-family: var(--font-display); font-size: 11px;
    color: var(--blue); letter-spacing: .12em; text-transform: uppercase;
    font-weight: 500; margin: 0 0 12px;
  }
  .colophon .built-by {
    font-family: var(--font-display); font-size: 22px;
    font-weight: 500; color: #fff; letter-spacing: -.01em;
    margin-bottom: 6px;
  }
  .colophon .co {
    font-family: var(--font-display); font-size: 13px;
    color: var(--text-faint); margin-bottom: 18px;
  }
  .colophon .co strong { color: #d8dbe1; font-weight: 500; }
  .colophon .links {
    display:flex; gap: 22px; justify-content:center;
    font-family: var(--font-display); font-size: 12.5px;
    color: var(--text-dim); flex-wrap: wrap;
  }
  .colophon .links a {
    color: var(--blue); text-decoration: none;
    border-bottom: 1px dotted rgba(138,180,248,.3); padding-bottom: 1px;
  }
  .colophon .links a:hover { border-bottom-style: solid; }

  /* responsive overrides for chapter layouts */
  @media (max-width: 980px) {
    .ch-row, .ch-row.with-note, .phone-with-note, .phone-with-note.reverse, .phone-twin {
      grid-template-columns: 1fr;
    }
    .chapter h2 { font-size: 22px; }
    .cover { padding: 22px; }
    .cover h1 { font-size: 24px; }
  }



/* ============== INTERACTIVE MOCKUP OVERRIDES ============== */
body {
  padding: 0; margin: 0;
  background: var(--bg);
  min-height: 100vh;
  display: flex; flex-direction: column;
  font-family: var(--font-body);
}
.shell { padding: 0; max-width: none; }

/* Header / app chrome */
.app-bar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(14, 15, 18, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 16px;
}
.app-bar .logo {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, #1a1c22, #0d0e12);
  display: grid; place-items: center;
  box-shadow: 0 4px 12px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.06);
}
.app-bar .title {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 500;
  color: #fff;
}
.app-bar .title small {
  font-weight: 400; color: var(--text-faint);
  margin-left: 8px; font-size: 12px;
}
.app-bar .spacer { flex: 1; }
.app-bar .nav-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-display);
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s ease;
  margin-left: 8px;
  text-decoration: none;
}
.app-bar .nav-pill:hover { background: rgba(255,255,255,.06); }
.app-bar .nav-pill.primary {
  background: linear-gradient(135deg, #8ab4f8, #5da8ff);
  color: #000; border-color: transparent;
  font-weight: 500;
}

/* Main stage */
.stage {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 28px 24px 60px;
  position: relative;
}

/* Journey picker - the home for the mockup */
.picker {
  max-width: 980px; margin: 0 auto; padding: 28px 0;
}
.picker .picker-head {
  text-align: center; margin-bottom: 36px;
}
.picker h1 {
  font-family: var(--font-display);
  font-size: 32px; font-weight: 500; letter-spacing: -.02em;
  margin: 0 0 10px;
}
.picker .picker-deck {
  color: var(--text-dim); font-size: 14.5px; line-height: 1.6;
  max-width: 580px; margin: 0 auto;
}
.flow-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.flow-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  cursor: pointer;
  transition: all .2s ease;
  position: relative;
  overflow: hidden;
}
.flow-card::before {
  content: ""; position: absolute; inset: 0;
  background: var(--gradient);
  opacity: 0; transition: opacity .2s ease;
  pointer-events: none;
}
.flow-card:hover {
  border-color: rgba(138,180,248,.3);
  transform: translateY(-2px);
}
.flow-card:hover::before { opacity: .04; }
.flow-card .badge-row {
  display: flex; gap: 8px; margin-bottom: 14px;
  align-items: center;
}
.flow-card .num {
  font-family: var(--font-display);
  font-size: 11px; color: var(--blue);
  letter-spacing: .12em; text-transform: uppercase;
  font-weight: 500;
}
.flow-card .duration {
  font-family: var(--font-display); font-size: 11px;
  color: var(--text-faint);
}
.flow-card .tag {
  font-family: var(--font-display); font-size: 9.5px;
  font-weight: 600; letter-spacing: .05em;
  padding: 2px 7px; border-radius: 4px;
  text-transform: uppercase;
}
.flow-card .tag.flagship {
  background: rgba(246,198,106,.18); color: #f6c66a;
}
.flow-card .tag.safety {
  background: rgba(74,210,125,.18); color: var(--green);
}
.flow-card h3 {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 500;
  letter-spacing: -.01em; margin: 0 0 8px;
  position: relative;
}
.flow-card p {
  color: var(--text-dim); font-size: 13px;
  line-height: 1.55; margin: 0 0 14px;
  position: relative;
}
.flow-card .start {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-display); font-size: 12.5px;
  color: var(--blue); font-weight: 500;
}
.flow-card.flagship-card {
  background: linear-gradient(140deg, rgba(246,198,106,.10), rgba(227,38,108,.05) 40%, rgba(93,168,255,.06) 100%);
  border-color: rgba(246,198,106,.3);
}

/* Player view — when in a flow */
.player {
  max-width: 920px; width: 100%; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center;
}
.breadcrumb {
  display: flex; gap: 10px; align-items: center;
  margin-bottom: 18px; flex-wrap: wrap;
  font-family: var(--font-display);
  font-size: 12px; color: var(--text-dim);
}
.breadcrumb .crumb-num {
  color: var(--blue); font-weight: 500;
}
.breadcrumb .crumb-name {
  color: #fff; font-weight: 500;
}
.progress-track {
  width: 200px; height: 4px;
  background: var(--surface);
  border-radius: 2px; overflow: hidden;
  margin-left: auto;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #4ad27d);
  transition: width .3s ease;
}

/* The actual phone in interactive mode */
.player-phone-wrap {
  position: relative;
  margin: 8px 0 22px;
}
.player .phone {
  margin: 0;
  box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.05);
}

/* In interactive mode, phone-screen should allow scrolling */
.player .phone-screen {
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.15) transparent;
}
.player .phone-screen::-webkit-scrollbar {
  width: 4px;
}
.player .phone-screen::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.15);
  border-radius: 2px;
}

/* Highlight rings on tappable elements */
[data-tap] {
  cursor: pointer;
  position: relative;
}
[data-tap]::after {
  content: ""; position: absolute; inset: -4px;
  border: 2px solid rgba(138,180,248,.5);
  border-radius: inherit;
  pointer-events: none;
  animation: pulseRing 1.8s ease-in-out infinite;
}
[data-tap]:hover::after {
  border-color: rgba(138,180,248,.85);
  animation: none;
}
@keyframes pulseRing {
  0%, 100% { opacity: .55; }
  50% { opacity: .95; transform: scale(1.02); }
}
[data-tap].tapped {
  transform: scale(.97);
  transition: transform .12s ease;
}

/* The hint text near the phone */
.hint {
  display: inline-flex; gap: 8px; align-items: center;
  background: rgba(138,180,248,.08);
  border: 1px solid rgba(138,180,248,.25);
  border-radius: 999px;
  padding: 8px 16px;
  font-family: var(--font-display);
  font-size: 12.5px; color: #c8d4f5;
  margin-bottom: 14px;
}
.hint .pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--blue);
  animation: pulse 1.4s ease-in-out infinite;
}

/* Player navigation */
.player-nav {
  display: flex; gap: 10px; flex-wrap: wrap;
  justify-content: center; margin-top: 6px;
}
.player-nav button {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-display);
  font-size: 12.5px; font-weight: 500;
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: all .15s ease;
}
.player-nav button:hover {
  background: rgba(255,255,255,.06);
  color: #fff;
}
.player-nav button:disabled {
  opacity: .4; cursor: not-allowed;
}

/* Slide animations */
.phone.slide-in-right { animation: slideInRight .28s ease-out; }
.phone.slide-in-left { animation: slideInLeft .28s ease-out; }
@keyframes slideInRight {
  from { transform: translateX(40px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slideInLeft {
  from { transform: translateX(-40px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Interstitial screens (generating, success) */
.interstitial {
  width: 380px; height: 760px;
  background: var(--phone-bg);
  border-radius: 40px;
  padding: 40px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  border: 6px solid #1a1b1f;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
  position: relative;
  overflow: hidden;
}
.interstitial.success {
  background:
    radial-gradient(ellipse at top, rgba(74,210,125,.18), transparent 60%),
    var(--phone-bg);
}
.interstitial.generating {
  background:
    radial-gradient(ellipse at center, rgba(138,180,248,.12), transparent 60%),
    var(--phone-bg);
}
.interstitial .big-icon {
  width: 72px; height: 72px; border-radius: 24px;
  display: grid; place-items: center;
  margin-bottom: 22px;
}
.interstitial.generating .big-icon {
  background: rgba(138,180,248,.15);
}
.interstitial.success .big-icon {
  background: rgba(74,210,125,.18);
}
.interstitial h2 {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 500;
  margin: 0 0 8px; color: #fff;
  letter-spacing: -.01em;
}
.interstitial p {
  font-size: 13.5px; color: var(--text-dim); line-height: 1.6;
  margin: 0 0 8px; max-width: 280px;
}
.interstitial .credits-used {
  margin-top: 18px; padding: 11px 18px;
  background: rgba(255,255,255,.04);
  border-radius: 12px;
  font-family: var(--font-display);
  font-size: 13px; color: #fff;
}
.interstitial .credits-used span {
  color: var(--accent); margin-right: 6px;
}
.interstitial .shot-progress {
  margin-top: 20px; width: 240px;
}
.interstitial .shot-progress .row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0;
  font-family: var(--font-display); font-size: 12px;
  color: var(--text-dim);
}
.interstitial .shot-progress .row.done { color: var(--green); }
.interstitial .shot-progress .row.active { color: #fff; }
.interstitial .shot-progress .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,.15);
  flex-shrink: 0;
}
.interstitial .shot-progress .done .dot { background: var(--green); }
.interstitial .shot-progress .active .dot {
  background: var(--blue);
  animation: pulse 1s ease-in-out infinite;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(138,180,248,.15);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

/* Recap card on success */
.recap {
  margin-top: 22px;
  padding: 14px 18px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 320px;
  text-align: left;
}
.recap h5 {
  font-family: var(--font-display); font-size: 10.5px;
  color: var(--text-faint); letter-spacing: .08em;
  text-transform: uppercase; font-weight: 500;
  margin: 0 0 8px;
}
.recap .recap-item {
  display: flex; justify-content: space-between; gap: 14px;
  padding: 4px 0; font-family: var(--font-display);
  font-size: 12px; color: #d8dbe1;
  align-items: flex-start;
}
.recap .recap-item > span:first-child {
  flex-shrink: 0; max-width: 60%;
}
.recap .recap-item > span:last-child {
  text-align: right;
}
.recap .recap-item .v { color: #fff; font-weight: 500; }

/* Footer */
.footer {
  margin-top: auto; padding: 24px;
  text-align: center;
  font-family: var(--font-display); font-size: 11.5px;
  color: var(--text-faint);
}
.footer a { color: var(--blue); text-decoration: none; }
.footer .by { color: #d8dbe1; }

/* Responsive */
@media (max-width: 720px) {
  .stage { padding: 18px 12px 40px; }
  .app-bar { padding: 12px 16px; }
  .app-bar .title small { display: none; }
  .player .phone { width: 320px; height: 700px; }
  .interstitial { width: 320px; height: 700px; padding: 28px; }
  .flow-cards { grid-template-columns: 1fr; }
}
</style>

// ===== Render the picker =====
function renderPicker() {
  STATE.view = 'picker';
  STATE.flowKey = null;
  STATE.stepIdx = 0;
  STATE.history = [];

  const cards = Object.entries(FLOWS).map(([key, flow], i) => {
    const tagHtml = flow.tag === 'flagship' ? '<span class="tag flagship">flagship</span>' :
                    flow.tag === 'safety'   ? '<span class="tag safety">safety</span>' : '';
    return `
      <div class="flow-card ${flow.tag === 'flagship' ? 'flagship-card' : ''}" onclick="startFlow('${key}')">
        <div class="badge-row">
          <span class="num">Flow ${String(i+1).padStart(2,'0')}</span>
          ${tagHtml}
          <span class="duration" style="margin-left:auto;">${flow.duration}</span>
        </div>
        <h3>${flow.title}</h3>
        <p>${flow.deck}</p>
        <div class="start">Start walk-through
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </div>
      </div>
    `;
  }).join('');

  stageEl().innerHTML = `
    <div class="picker">
      <div class="picker-head">
        <h1>Pick a journey</h1>
        <p class="picker-deck">Five guided walk-throughs of Flow as a standalone Android product. Tap the highlighted button on each screen to advance. State persists across steps — credits, regens, permissions are all live.</p>
      </div>
      <div class="flow-cards">${cards}</div>
    </div>
  `;
}

// ===== Start a flow =====
window.startFlow = function(key) {
  STATE.view = 'player';
  STATE.flowKey = key;
  STATE.stepIdx = 0;
  STATE.history = [];
  // Reset regen state for notebook flow
  STATE.regensRemaining = { 1: 2, 2: 2, 3: 1, 4: 0 };
  renderStep();
};

// ===== Render the current step =====
function renderStep() {
  const flow = FLOWS[STATE.flowKey];
  const step = flow.steps[STATE.stepIdx];
  if (!step) {
    renderPicker();
    return;
  }

  // Compute progress
  const total = flow.steps.length;
  const progress = ((STATE.stepIdx + 1) / total) * 100;

  // Determine phone content
  let phoneHtml;
  if (typeof step.phone === 'number') {
    phoneHtml = PHONES[String(step.phone)];
  } else {
    // Interstitial
    phoneHtml = interstitial(step.phone);
  }

  // Build the player UI
  const stepLabel = step.hint || (step.phone && typeof step.phone === 'string' ? '' : 'Advance');
  const hintHtml = stepLabel ? `<div class="hint"><span class="pulse-dot"></span>${escapeHtml(stepLabel)}</div>` : '';

  stageEl().innerHTML = `
    <div class="player">
      <div class="breadcrumb">
        <span class="crumb-num">Flow ${String(Object.keys(FLOWS).indexOf(STATE.flowKey)+1).padStart(2,'0')}</span>
        <span>·</span>
        <span class="crumb-name">${flow.title}</span>
        <span>·</span>
        <span>step ${STATE.stepIdx + 1} of ${total}</span>
        <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      </div>
      ${hintHtml}
      <div class="player-phone-wrap">
        ${phoneHtml}
      </div>
      <div class="player-nav">
        <button onclick="goBack()" ${STATE.history.length === 0 ? 'disabled' : ''}>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          Back
        </button>
        <button onclick="renderPicker()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          All journeys
        </button>
        <button onclick="restartFlow()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9"/><path d="M3 3v6h6"/></svg>
          Restart
        </button>
      </div>
    </div>
  `;

  // Wire up tap targets
  if (step.taps && step.taps.length) {
    wireTapTargets(step.taps);
  }

  // Apply 'after-regen' variant tweaks if relevant
  if (step.variant === 'after-regen' && typeof step.phone === 'number' && step.phone === 19) {
    applyAfterRegenVariant();
  }

  // Auto-advance interstitials
  if (step.autoAdvance) {
    setTimeout(() => {
      STATE.history.push(STATE.stepIdx);
      STATE.stepIdx = step.goto !== undefined ? step.goto : STATE.stepIdx + 1;
      renderStep();
    }, step.autoAdvance);
  }
}

// ===== Wire tap targets onto phone elements =====
function wireTapTargets(taps) {
  const phoneRoot = document.querySelector('.player-phone-wrap');
  if (!phoneRoot) return;

  taps.forEach((tap, tapIdx) => {
    let matched = [];

    if (tap.matchText) {
      // Find elements whose textContent contains the match string.
      // Normalize: strip all whitespace from both sides for the comparison
      // (handles <br> → empty, newlines, multiple spaces, etc.)
      const norm = s => s.replace(/\s+/g, '').toLowerCase();
      const target = norm(tap.matchText);
      const all = phoneRoot.querySelectorAll('*');
      all.forEach(el => {
        const t = norm(el.textContent || '');
        if (t.includes(target) && t.length < target.length + 80) {
          matched.push(el);
        }
      });
      // Filter to smallest matching element (the innermost wrapper)
      matched = matched.filter(el => {
        return !matched.some(other => other !== el && el.contains(other));
      });

      // If treatAsLabel, climb up to the parent wrapper (e.g., a .mode-pair)
      if (tap.treatAsLabel) {
        matched = matched.map(el => {
          // Climb until we hit a wrapper like .mode-pair, .acc-row, etc.
          let p = el;
          while (p && p !== phoneRoot && !p.classList.contains('mode-pair') &&
                 !p.classList.contains('acc-row') && !p.classList.contains('plan-card') &&
                 !p.classList.contains('flow-card')) {
            p = p.parentElement;
          }
          return p && p !== phoneRoot ? p : el;
        });
      }

      // whichIndex picks one specific element if multiple match
      if (tap.whichIndex !== undefined) {
        matched = matched[tap.whichIndex] ? [matched[tap.whichIndex]] : [];
      }
    }
    else if (tap.matchClass) {
      matched = Array.from(phoneRoot.querySelectorAll('.' + tap.matchClass));
    }

    matched.forEach(el => {
      el.setAttribute('data-tap', String(tapIdx));
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        el.classList.add('tapped');
        setTimeout(() => {
          STATE.history.push(STATE.stepIdx);
          if (tap.action) applyAction(tap.action);
          STATE.stepIdx = tap.goto;
          renderStep();
        }, 140);
      });
    });

    // Scroll the phone screen to bring the (first) tap target into view
    if (matched.length > 0 && tapIdx === 0) {
      requestAnimationFrame(() => {
        const target = matched[0];
        // Find nearest scrollable ancestor
        let scroller = target.parentElement;
        while (scroller) {
          const cs = window.getComputedStyle(scroller);
          if ((cs.overflowY === 'auto' || cs.overflowY === 'scroll') && scroller.scrollHeight > scroller.clientHeight) {
            break;
          }
          if (scroller.classList.contains('phone-screen') || scroller.classList.contains('interstitial')) break;
          scroller = scroller.parentElement;
        }
        if (scroller && (scroller.scrollHeight > scroller.clientHeight)) {
          const tRect = target.getBoundingClientRect();
          const sRect = scroller.getBoundingClientRect();
          if (tRect.bottom > sRect.bottom - 30 || tRect.top < sRect.top + 30) {
            const offset = (tRect.top - sRect.top) - (sRect.height / 2 - tRect.height / 2);
            scroller.scrollTo({ top: scroller.scrollTop + offset, behavior: 'smooth' });
          }
        }
      });
    }
  });
}

// ===== Apply state mutations =====
function applyAction(action) {
  if (action.regenShot !== undefined) {
    const s = action.regenShot;
    STATE.regensRemaining[s] = Math.max(0, (STATE.regensRemaining[s] || 0) - 1);
  }
}

// ===== Variant tweaks for Phone 19 after a regen =====
function applyAfterRegenVariant() {
  // Shot 02 has been regenerated — update its label from "2 free regens left" to "1 free regen left",
  // and turn the row green/approved.
  const root = document.querySelector('.player-phone-wrap');
  if (!root) return;
  // Find the second shot row by looking for the "Yellow raincoat handover" text
  const rows = Array.from(root.querySelectorAll('div')).filter(d =>
    (d.textContent || '').includes('Yellow raincoat handover') && d.children.length < 8
  );
  // Update the closest container with the regen-count text
  const rowAll = Array.from(root.querySelectorAll('div'));
  rowAll.forEach(d => {
    if ((d.textContent || '').trim() === '2 free regens left') {
      d.textContent = 'regenerated · 1 free left';
      d.style.color = 'var(--green)';
    }
  });
  // Also update shot 03 to no longer be in "regenerating" state — make it look approved
  rowAll.forEach(d => {
    if ((d.textContent || '').trim().startsWith('regenerating')) {
      d.innerHTML = '<span style="width:5px; height:5px; border-radius:50%; background:var(--green); display:inline-block; vertical-align:middle; margin-right:5px;"></span>approved';
      d.style.color = 'var(--green)';
    }
  });
}

// ===== Back navigation =====
window.goBack = function() {
  if (STATE.history.length === 0) return;
  STATE.stepIdx = STATE.history.pop();
  renderStep();
};

window.restartFlow = function() {
  STATE.stepIdx = 0;
  STATE.history = [];
  STATE.regensRemaining = { 1: 2, 2: 2, 3: 1, 4: 0 };
  renderStep();
};

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', renderPicker);

</script>
